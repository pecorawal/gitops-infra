# Demo C · alvo para o exec em runtime: imagem atual, sem CVE corrigível,
# portanto ADMITIDA. A violação aparece só quando alguém entra no pod.
#   oc apply -f seguranca/demo-apps/variacoes/runtime-ok.yaml
#   oc -n pagamentos-demo exec deploy/pagamentos-worker -- curl -s https://example.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-worker
  namespace: pagamentos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagamentos-worker
  template:
    metadata:
      labels:
        app: pagamentos-worker
    spec:
      containers:
        - name: worker
          image: registry.access.redhat.com/ubi9/ubi:9.8
          command: ["/bin/sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
