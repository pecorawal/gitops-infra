# ---------------------------------------------------------------------------
#  Etapa 03 · viola "DEMO - Container privilegiado em namespace PCI"
#  O Deployment é criado (o ACS avalia a especificação), mas o OpenShift recusa os pods:
#  a SCC restricted-v2 não permite privileged. Duas camadas: ACS registra e alerta,
#  a plataforma impede a execução. O Argo CD fica Progressing/Degraded até a próxima etapa.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-api
  namespace: pagamentos-demo
  labels:
    app: pagamentos-api
  annotations:
    demo.acs/etapa: '03 - viola: container privilegiado'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagamentos-api
  template:
    metadata:
      labels:
        app: pagamentos-api
    spec:
      containers:
      - name: api
        image: registry.access.redhat.com/ubi9/ubi-minimal:9.8
        command:
        - /bin/sh
        - -c
        - while true; do echo pagamentos-api ok; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          privileged: true
