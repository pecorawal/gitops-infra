# ---------------------------------------------------------------------------
#  Etapa 04 · viola EM RUNTIME "DEMO - Ferramenta de rede executada em pod de pagamentos"
#  Nada de errado na especificação: imagem atual, sem privilégio. O problema é o
#  COMPORTAMENTO — o container executa curl. Só o runtime (Collector) enxerga isso.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-api
  namespace: pagamentos-demo
  labels:
    app: pagamentos-api
  annotations:
    demo.acs/etapa: '04 - viola em runtime: ferramenta de rede'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagamentos-api
  template:
    metadata:
      labels:
        app: pagamentos-api
    spec:
      containers:
      - name: api
        image: registry.access.redhat.com/ubi9/ubi:9.8
        command:
        - /bin/sh
        - -c
        - while true; do curl -s -o /dev/null https://www.redhat.com; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
