# ---------------------------------------------------------------------------
#  Etapa 06 · versão final — corrige tudo e ainda endurece a etapa 00:
#  sem token de service account montado (a aplicação não fala com a API do Kubernetes).
#  Nenhuma política DEMO violada; as violações de deploy das etapas anteriores vão
#  para Resolved quando esta versão substitui a anterior.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-api
  namespace: pagamentos-demo
  labels:
    app: pagamentos-api
  annotations:
    demo.acs/etapa: 06 - versão final (aceitável e endurecida)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagamentos-api
  template:
    metadata:
      labels:
        app: pagamentos-api
    spec:
      containers:
      - name: api
        image: registry.access.redhat.com/ubi9/ubi-minimal:9.8
        command:
        - /bin/sh
        - -c
        - while true; do echo pagamentos-api ok; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      automountServiceAccountToken: false
