# ---------------------------------------------------------------------------
#  Etapa 01 · viola "DEMO - CVE corrigível Importante ou Crítica"
#  Imagem com log4j 2.14.1: CVE-2021-44228 (Log4Shell, CVSS 10) e 10 outras Críticas,
#  todas com correção. Também dispara as políticas nativas Log4Shell e Spring4Shell.
#  SEGURANÇA DA DEMO: o command troca o java da imagem por 'sleep' — a imagem vulnerável
#  está no cluster (é o que o ACS avalia), mas a aplicação explorável não sobe.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-api
  namespace: pagamentos-demo
  labels:
    app: pagamentos-api
  annotations:
    demo.acs/etapa: '01 - viola: CVE corrigível (Log4Shell)'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagamentos-api
  template:
    metadata:
      labels:
        app: pagamentos-api
    spec:
      containers:
      - name: api
        image: ghcr.io/christophetd/log4shell-vulnerable-app@sha256:6f88430688108e512f7405ac3c73d47f5c370780b94182854ea2cddc6bd59929
        command:
        - sleep
        - infinity
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
