# ---------------------------------------------------------------------------
#  Demo D · Cobertura uniforme de segurança  (C03 C10 · RSK-02)
#
#  "Nenhum cluster nasce sem ACS": todo cluster que entra no Placement recebe
#  o operador do ACS, a Cluster Registration Secret e o SecuredCluster.
#  A 3ª política só INFORMA se o Sensor está de pé — é ela que vira o KPI.
#
#  Pré-requisito no hub (uma vez):
#    roxctl central crs generate acm-frota -o crs.yaml        # ACS >= 4.7
#    oc -n acm-policies create secret generic acs-crs --from-file=crs.yaml
#      (em ACS < 4.7, use o init bundle no lugar da CRS)
#  e ajuste CENTRAL_ENDPOINT abaixo.
#
#  Aplicar no hub:  oc apply -f seguranca/acm/policy-acs-cobertura.yaml
# ---------------------------------------------------------------------------
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: acs-secured-cluster
  namespace: acm-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SI System and Information Integrity
    policy.open-cluster-management.io/controls: SI-4 System Monitoring
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhacs-operator
        spec:
          remediationAction: enforce
          severity: high
          complianceType: musthave
          upgradeApproval: Automatic
          operatorGroup:
            name: rhacs-operator
            namespace: rhacs-operator
          subscription:
            name: rhacs-operator
            namespace: rhacs-operator
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: acs-secured-cluster-cr
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: stackrox
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: cluster-registration-secret
                  namespace: stackrox
                type: Opaque
                data: '{{hub copySecretData "acm-policies" "acs-crs" hub}}'
            - complianceType: musthave
              objectDefinition:
                apiVersion: platform.stackrox.io/v1alpha1
                kind: SecuredCluster
                metadata:
                  name: stackrox-secured-cluster-services
                  namespace: stackrox
                spec:
                  clusterName: '{{ fromClusterClaim "name" }}'
                  centralEndpoint: CENTRAL_ENDPOINT:443   # ex.: central-stackrox.apps.hub.example.com:443
                  admissionControl:
                    # ACS 4.x. Em versões mais novas o operador expõe
                    # "enforcement: Enabled"; confira 'oc explain securedcluster.spec.admissionControl'.
                    listenOnCreates: true
                    listenOnUpdates: true
                    listenOnEvents: true
                    contactImageScanners: ScanIfMissing
                    timeoutSeconds: 20
                    bypass: BreakGlassAnnotation
                  auditLogs:
                    collection: Auto
                  perNode:
                    collector:
                      collection: CORE_BPF
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: acs-sensor-saudavel
        spec:
          remediationAction: inform      # só mede — é a régua do RSK-02
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: sensor
                  namespace: stackrox
                status:
                  availableReplicas: 1
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-acs-frota
  namespace: acm-policies
spec:
  # Toda a frota, exceto o hub (que já hospeda o Central e o próprio SecuredCluster)
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: DoesNotExist
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-acs-secured-cluster
  namespace: acm-policies
placementRef:
  name: placement-acs-frota
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: acs-secured-cluster
    apiGroup: policy.open-cluster-management.io
    kind: Policy
