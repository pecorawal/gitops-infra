# ---------------------------------------------------------------------------
#  ACESSO DO ESO A CREDENTIAL COMPARTILHADA DO ACM
# ---------------------------------------------------------------------------
#  O Hive so le Secrets do namespace do ClusterDeployment, mas a Credential do
#  ACM e uma so para todos os provisionamentos. Este arquivo cria o caminho que
#  permite ao External Secrets Operator copia-la, sob demanda, para o namespace
#  de cada cluster novo -- sem nenhum "oc create secret" manual.
#
#  E um ClusterSecretStore do tipo "kubernetes": a origem e o PROPRIO hub. O ESO
#  se autentica com a ServiceAccount abaixo, cujo Role so enxerga o Secret da
#  Credential, e nada mais.
#
#  AJUSTE OBRIGATORIO ANTES DE SINCRONIZAR
#  ---------------------------------------
#  Troque acm-credentials pelo namespace onde a sua Credential vive, nos QUATRO
#  pontos marcados com <<< NAMESPACE. Descubra com:
#
#    oc get secret -A -l cluster.open-cluster-management.io/type=azr \
#      -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name
#
#  O mesmo namespace vai em provision.credentials.sourceNamespace do values do
#  cluster, e o nome do Secret em provision.credentials.sourceSecret.
#
#  Requer o External Secrets Operator instalado no hub -- ja e o caso, pois
#  charts/import-cluster depende dele.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-acm-credentials-reader
  namespace: acm-credentials          # <<< NAMESPACE
---
# Somente leitura, e apenas nos Secrets deste namespace.
# Para restringir a uma Credential especifica, acrescente:
#   resourceNames: ["azure-cliente"]
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-acm-credentials-reader
  namespace: acm-credentials          # <<< NAMESPACE
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-acm-credentials-reader
  namespace: acm-credentials          # <<< NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-acm-credentials-reader
subjects:
  - kind: ServiceAccount
    name: eso-acm-credentials-reader
    namespace: acm-credentials        # <<< NAMESPACE
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: acm-credentials-hub
spec:
  provider:
    kubernetes:
      # Namespace de ORIGEM, onde o ESO procura a Credential.
      remoteNamespace: acm-credentials # <<< NAMESPACE
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: acm-credentials   # <<< NAMESPACE
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-acm-credentials-reader
          namespace: acm-credentials   # <<< NAMESPACE
