# ---------------------------------------------------------------------------
#  VINCULO DOS ManagedClusterSets AO NAMESPACE DO ARGOCD
# ---------------------------------------------------------------------------
#  Os ManagedClusterSets "pro" e "non-pro" JA EXISTEM no ACM e nao sao criados
#  por este repositorio -- de proposito, para que um prune do ArgoCD nunca possa
#  apagar um agrupamento de clusters de producao.
#
#  O que este arquivo faz e VINCULAR os dois ao namespace openshift-gitops. Sem
#  o binding, a Placement "all-managed-clusters" (main-placement.yaml) nao
#  enxerga os clusters desses sets, o GitOpsCluster nao os registra no ArgoCD e
#  nenhuma Application de day-2 encontra destino.
#
#  Uma Placement sem spec.clusterSets seleciona a partir de TODOS os sets
#  vinculados ao seu namespace -- por isso a Placement existente continua
#  cobrindo pro e non-pro sem alteracao.
#
#  Se os nomes dos sets no seu ACM forem outros, mude aqui E em
#  clusterSets.byEnv de clusters/<cluster>/values.yaml. Confira com:
#    oc get managedclusterset
# ---------------------------------------------------------------------------
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: pro
  namespace: openshift-gitops
spec:
  clusterSet: pro
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: non-pro
  namespace: openshift-gitops
spec:
  clusterSet: non-pro
