# =============================================================================
#  ARQUIVO ÚNICO DE CONFIGURAÇÃO DO CLUSTER
# =============================================================================
#  Este é o ÚNICO arquivo que você precisa editar.
#  O nome do diretório que contém este arquivo DEVE ser igual a clusterName.
#
#  Preencha todos os campos marcados como <PREENCHER> e vire os interruptores
#  "enabled: true" camada por camada. O ArgoCD fica escutando este arquivo e
#  materializa cada camada assim que ela é habilitada.
#
#  Ordem recomendada:
#    1) provision.enabled    -> cria o cluster       (~40 min)
#    2) operators.enabled    -> instala os operators
#    3) certManager.enabled  -> emite os certificados
#    4) ingress.enabled      -> cria os IngressControllers
#    5) externalDNS.enabled  -> publica os registros de DNS
#
#  Guia completo: docs/cliente/
# =============================================================================


# =============================================================================
#  IDENTIDADE DO CLUSTER
# =============================================================================
clusterName: azr-cliente-dev-01     # == nome deste diretório, do namespace no hub e do ManagedCluster
baseDomain: "cgibs.gov.br"          # domínio base (Azure DNS Zone pública)
cloudProvider: Azure

# ---------------------------------------------------------------------------
#  ManagedClusterSet -- decidido por labels.env
# ---------------------------------------------------------------------------
#  Os dois ManagedClusterSets ja existem no ACM e NAO sao criados por este
#  repositorio. O que este values decide e em qual deles o cluster entra.
#
#  Para o vinculo funcionar, o set precisa estar ligado ao namespace
#  openshift-gitops por um ManagedClusterSetBinding -- ja aplicado em
#  bootstrap/03-cluster-set-bindings.yaml para pro e non-pro.
#
#  A ESQUERDA do mapa e o valor de labels.env (o AMBIENTE).
#  A DIREITA e o nome do ManagedClusterSet como ele existe no ACM.
#  Confira os nomes reais com: oc get managedclusterset
# ---------------------------------------------------------------------------
clusterSets:
  default: non-pro           # usado quando labels.env nao consta no mapa abaixo
  byEnv:
    prod: pro
    pro: pro
    non-prod: non-pro
    non-pro: non-pro
    # atalhos, para nao obrigar o env a ser literalmente "non-pro"
    dev: non-pro
    qa: non-pro
    hml: non-pro

# Escape hatch: preencha para ignorar o mapeamento acima e forcar um set.
clusterSet: ""

labels:
  # env DECIDE O CLUSTERSET (ver clusterSets acima). Valor obrigatorio:
  # se nao resolver nenhum set, a renderizacao do chart falha de proposito.
  env: "dev"
  region: "brazilsouth"
  vendor: "OpenShift"
  cloud: "Azure"
  criticality: "high"
  compliance: "pci-dss"
  # NÃO REMOVA a label abaixo: é ela que faz o ACM registrar este cluster
  # como destino de deploy no ArgoCD (via GitOpsCluster + Placement).
  apps.open-cluster-management.io/replicate-to-argocd: "true"

addons:
  policyController: true
  searchCollector: true
  applicationManager: true
  certPolicyController: true


# =============================================================================
#  1. PROVISIONAMENTO -- OpenShift IPI na Azure (Hive / openshift-install)
# =============================================================================
provision:
  enabled: false                    # <-- vire para true SÓ depois de preencher tudo abaixo

  # Versão do OpenShift. Liste as disponíveis no hub com:
  #   oc get clusterimageset
  imageSetRef: "img4.18.20-multi-appsub"

  # -------------------------------------------------------------------------
  #  CREDENCIAIS
  #  O Hive só lê Secrets do namespace do ClusterDeployment, mas a Credential do
  #  ACM é UMA SÓ para todos os provisionamentos. Há dois caminhos para levá-la
  #  até o namespace de cada cluster:
  #
  #  mode: existing  (PADRÃO, não exige operador nenhum)
  #      Rode UMA vez por cluster, antes de commitar:
  #          ./docs/cliente/scripts/preparar-credenciais.sh <cluster>
  #      Ele cria o namespace e os dois Secrets a partir da Credential do ACM,
  #      já nos formatos que o Hive exige. Os nomes seguem a convenção
  #      <cluster>-azure-creds e <cluster>-pull-secret, que é o que o chart
  #      procura -- nada mais precisa ser preenchido aqui.
  #
  #  mode: externalSecret  (exige o External Secrets Operator no hub)
  #      O ESO copia a Credential sozinho, a cada sincronização. Sem passo
  #      manual algum, mas o CRD ExternalSecret precisa existir.
  #      ATENÇÃO: sem o ESO instalado, este modo faz a Application inteira ir a
  #      ComparisonError ("no matches for kind ExternalSecret") e NADA é
  #      aplicado -- nem o Namespace.
  # -------------------------------------------------------------------------
  credentials:
    mode: existing

    # ---- modo externalSecret (ignorado quando mode=existing) ----
    sourceNamespace: acm-credentials
    sourceSecret: ""
    clusterSecretStore: acm-credentials-hub
    refreshInterval: "1h"
    copySshKey: true

    # Vale para os DOIS modos. Com false, o ClusterDeployment sai SEM o bloco
    # sshPrivateKeySecretRef (cluster sem acesso SSH aos nós). Use false quando
    # a Credential do ACM não tem ssh-privatekey -- o webhook do Hive recusa o
    # bloco presente com name vazio.
    sshPrivateKey: true

    # ---- modo existing ----
    # Vazios = usa a convenção <cluster>-azure-creds / <cluster>-pull-secret,
    # exatamente os nomes que preparar-credenciais.sh gera.
    # Preencha só se os seus Secrets tiverem outros nomes.
    existingCredentialsSecret: ""
    existingPullSecret: ""
    existingSshPrivateKeySecret: ""

  # Internal = API e ingress default só acessíveis pela VNet (cluster privado).
  # External = API e ingress default publicados na internet.
  publish: Internal

  azure:
    region: "brazilsouth"
    cloudName: AzurePublicCloud

    # Resource Group onde está a Azure DNS Zone PÚBLICA do baseDomain.
    baseDomainResourceGroupName: "<PREENCHER>"

    # ---- BYO VNet: a VNet e as subnets já existem e NÃO são criadas pelo installer ----
    networkResourceGroupName: "<PREENCHER>"   # RG que contém a VNet
    virtualNetwork: "<PREENCHER>"             # nome da VNet
    controlPlaneSubnet: "<PREENCHER>"         # subnet dos masters
    computeSubnet: "<PREENCHER>"              # subnet dos workers

    # UserDefinedRouting = a saída para a internet passa pela sua rota/firewall.
    # Use Loadbalancer se não houver UDR configurado na subnet.
    outboundType: UserDefinedRouting

  networking:
    networkType: OVNKubernetes
    # clusterNetwork, machineNetwork e serviceNetwork aceitam DOIS formatos:
    #
    #   forma curta (abaixo)          forma do install-config
    #   clusterNetwork: "10.128.0.0/14"    clusterNetwork:
    #   hostPrefix: 23                       - cidr: 10.128.0.0/14
    #                                          hostPrefix: 23
    #
    # Os dois geram o mesmo install-config. Use o que preferir.
    clusterNetwork: "10.128.0.0/14"
    hostPrefix: 23
    serviceNetwork: "172.30.0.0/16"
    machineNetwork: "<PREENCHER>"             # CIDR da VNet acima, ex: 10.0.0.0/16

  controlPlane:
    replicas: 3
    type: Standard_D8s_v3
    osDisk:
      diskSizeGB: 1024
      diskType: Premium_LRS
    zones: ["1", "2", "3"]

  compute:
    replicas: 3
    type: Standard_D4s_v3
    osDisk:
      diskSizeGB: 512
      diskType: Premium_LRS
    zones: ["1", "2", "3"]

  fips: false

  # Rede de seguranca contra descomissionamento acidental.
  # true  = se o ClusterDeployment for apagado, o Hive NAO destroi a
  #         infraestrutura na Azure; sobram recursos orfaos para limpar a mao.
  # false = comportamento padrao do Hive: apagar o ClusterDeployment dispara o
  #         job de deprovision e o cluster e destruido.
  # Os objetos criticos ja levam Prune=false,Delete=false; isto e a camada extra
  # para quem nao quer nem a possibilidade de perder um cluster por engano.
  preserveOnDelete: false

  # Separa os objetos do ACM (ManagedCluster, KlusterletAddonConfig) dos objetos
  # do Hive (Namespace, install-config, ClusterDeployment, MachinePool).
  #
  # Deixe false para BISSECAR o problema "o namespace some durante o sync":
  # no ACM, o namespace de mesmo nome pertence ao ciclo de vida do
  # ManagedCluster, e o managedcluster-import-controller o APAGA se o
  # ManagedCluster for rejeitado ou entrar em detach. Com acmImport desligado,
  # o sync aplica so o Hive e o namespace fica fora do alcance desse controlador.
  #
  # Depois que o provisionamento andar, volte para true -- sem o ManagedCluster
  # o cluster nao e importado no ACM nem registrado no ArgoCD, e nenhuma
  # Application de day-2 encontra destino.
  acmImport:
    enabled: true


# =============================================================================
#  2. OPERATORS -- instalados no cluster provisionado (spoke)
# =============================================================================
operators:
  enabled: false

  certManager:
    channel: stable-v1
    source: redhat-operators

  externalDNS:
    channel: stable-v1
    source: redhat-operators


# =============================================================================
#  3. CERT-MANAGER -- ClusterIssuers e certificados
# =============================================================================
certManager:
  enabled: false

  # ---- Overrides do OPERANDO cert-manager (CR CertManager/cluster) ----------
  # O cert-manager-operator cria sozinho o CR "cluster"; aqui apenas ajustamos
  # o spec dele (ServerSideApply, sem tomar posse do objeto).
  #
  # Os dois argumentos abaixo NAO sao opcionais num cluster privado:
  # o desafio DNS01 grava o TXT _acme-challenge na zona PUBLICA e depois faz a
  # auto-checagem. Com o resolver padrao do pod, essa consulta cai no DNS da
  # VNet, que enxerga a Private DNS Zone -- o TXT nao e encontrado e o
  # Certificate trava em "Waiting for DNS-01 challenge propagation".
  # Forcando resolvers publicos, a auto-checagem consulta a zona certa.
  #
  # Se a saida para 53/udp na internet for bloqueada, troque a lista por um
  # resolver interno que enxergue a zona PUBLICA.
  operatorConfig:
    enabled: true
    managementState: Managed
    logLevel: Normal
    operatorLogLevel: Normal
    controller:
      overrideArgs:
        - "--dns01-recursive-nameservers-only"
        - "--dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53"
      # Ex.: proxy de saida do cliente
      # overrideEnv:
      #   - name: HTTPS_PROXY
      #     value: "http://proxy.cgibs.gov.br:3128"
      #   - name: NO_PROXY
      #     value: ".cluster.local,.svc,169.254.169.254"
      overrideEnv: []
      overrideResources: {}
    webhook:
      overrideArgs: []
    cainjector:
      overrideArgs: []

  # ClusterIssuer "letsencrypt-prod": ACME com desafio DNS01 na Azure DNS Zone
  # PÚBLICA. É este issuer que emite os DOIS wildcards:
  #
  #   *.cgibs.gov.br       -> IngressController público
  #   *.pri.cgibs.gov.br   -> IngressController privado
  #
  # Sim, o wildcard privado também sai daqui. O desafio DNS01 grava o TXT
  # _acme-challenge.pri.cgibs.gov.br na zona PÚBLICA cgibs.gov.br, e é só esse
  # registro que o Let's Encrypt consulta -- o nome final continua resolvendo
  # apenas na Private DNS Zone.
  #
  # REQUISITO: pri.cgibs.gov.br NÃO pode estar delegado publicamente para outro
  # servidor. Se estiver, o TXT não seria encontrado. Confirme com:
  #   dig +short NS pri.cgibs.gov.br
  # (não deve retornar nada; a zona autoritativa tem que ser cgibs.gov.br)
  acme:
    enabled: true
    email: "<PREENCHER>"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    # Para testes use o staging (não conta na cota, mas o cert não é confiável):
    # server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    azureDNS:
      subscriptionID: "<PREENCHER>"
      tenantID: "<PREENCHER>"
      resourceGroupName: "<PREENCHER>"   # RG da Azure DNS Zone PÚBLICA
      hostedZoneName: "cgibs.gov.br"     # zona pública: atende os dois wildcards
      environment: AzurePublicCloud
      clientID: "<PREENCHER>"            # appId do Service Principal
      # O clientSecret NUNCA vai para o Git. Ele vem do Secret abaixo, criado
      # no namespace cert-manager por docs/cliente/scripts/criar-secrets-day2.sh
      clientSecretRef:
        name: azuredns-config
        key: client-secret

  # CA interna -- NÃO utilizada nesta arquitetura.
  # Os dois ingress usam certificados ACME confiáveis, então nada precisa ser
  # distribuído aos clients. Mantida desligada para o caso de um ambiente
  # futuro sem domínio delegado publicamente.
  internalCA:
    enabled: false
    selfSigned: true
    caSecretName: internal-ca-key-pair
    commonName: "CGIBS Internal CA"
    durationHours: 87600

  # Certificados de aplicação.
  # Os wildcards acima já cobrem qualquer host de um nível sob os dois domínios,
  # então só declare aqui aplicações que precisem de certificado PRÓPRIO
  # (host fora do wildcard, chave separada, ou exigência de auditoria).
  appCertificates: []
    # - name: checkout-tls
    #   namespace: pagamentos
    #   issuer: letsencrypt-prod
    #   secretName: checkout-tls
    #   dnsNames:
    #     - "checkout.pri.cgibs.gov.br"

# =============================================================================
#  4. INGRESS CONTROLLERS -- um privado e um público, além do default
# =============================================================================
#  A separação é feita pela label "ingress-type" na Route:
#
#    ingress-type: private   -> IC private  -> LB interno  -> Private DNS Zone
#    ingress-type: public    -> IC public   -> LB público  -> Azure DNS Zone
#    qualquer outro valor    -> IC default  -> aplicações internas do OpenShift
#    sem a label             -> IC default  (console, oauth, ...)
# =============================================================================
ingress:
  enabled: false

  default:
    # O IngressController default fica RESERVADO às aplicações internas do
    # OpenShift. Com isolateByLabel=true ele passa a admitir apenas Routes cuja
    # label "ingress-type" seja DIFERENTE de public e private (ou que não
    # tenham a label -- é assim que o seletor NotIn do Kubernetes funciona).
    isolateByLabel: true

    # Escopo do Load Balancer do router DEFAULT (console, OAuth, plataforma).
    # CLUSTER PRIVADO = Internal. NUNCA External aqui: o LB do default seria
    # recriado como público, com IP novo, e o acesso interno à console cairia.
    # Confira o valor atual ANTES de sincronizar:
    #   oc get ingresscontroller default -n openshift-ingress-operator \
    #     -o jsonpath='{.spec.endpointPublishingStrategy.loadBalancer.scope}{"\n"}'
    scope: Internal
    labelKey: ingress-type
    reservedValues:
      - public
      - private

  # ---- IngressController PRIVADO: Load Balancer interno da Azure ----
  private:
    enabled: true
    name: private
    domain: "pri.cgibs.gov.br"      # domínio da Azure PRIVATE DNS Zone
    replicas: 2
    scope: Internal                 # Azure Internal Load Balancer
    # LABEL DE ADMISSÃO: só Routes com ingress-type=private entram aqui.
    routeSelector:
      key: ingress-type
      value: private
    # Opcional: restringe também por namespace. Ex:
    #   namespaceSelector: { environment: producao }
    namespaceSelector: {}
    # Opcional: fixa os routers em nós específicos. Ex:
    #   nodePlacement: { node-role.kubernetes.io/infra: "" }
    nodePlacement: {}
    certificate:
      enabled: true
      issuer: letsencrypt-prod      # wildcard *.pri.cgibs.gov.br
      secretName: private-ingress-tls

  # ---- IngressController PÚBLICO: Load Balancer público da Azure ----
  public:
    enabled: true
    name: public
    domain: "cgibs.gov.br"          # domínio da Azure DNS Zone pública
    replicas: 2
    scope: External                 # Azure Public Load Balancer ("publish external")
    routeSelector:
      key: ingress-type
      value: public
    namespaceSelector: {}
    nodePlacement: {}
    certificate:
      enabled: true
      issuer: letsencrypt-prod      # wildcard *.cgibs.gov.br
      secretName: public-ingress-tls

# =============================================================================
#  5. EXTERNAL DNS -- uma instância por zona / por IngressController
# =============================================================================
externalDNS:
  enabled: false

  azure:
    subscriptionId: "<PREENCHER>"
    tenantId: "<PREENCHER>"
    aadClientId: "<PREENCHER>"      # appId do Service Principal
    # DEIXE SEMPRE VAZIO NO GIT.
    # Os Secrets azure.json (um por zona) são criados fora do repositório por
    # docs/cliente/scripts/criar-secrets-day2.sh, que lê exatamente os valores
    # acima e pede o client secret interativamente.
    aadClientSecret: ""

  # ---- Azure PRIVATE DNS Zone <- rotas com ingress-type=private ----
  private:
    enabled: true
    name: private
    routerName: private             # DEVE casar com ingress.private.name
    domain: "pri.cgibs.gov.br"      # DEVE casar com ingress.private.domain
    resourceGroup: "<PREENCHER>"    # RG da Private DNS Zone
    # az network private-dns zone show -n pri.cgibs.gov.br -g <rg> --query id -o tsv
    zoneId: "<PREENCHER>"           # .../providers/Microsoft.Network/privateDnsZones/pri.cgibs.gov.br
    excludeDomains: []
    configSecretName: azure-config-file-private

  # ---- Azure PUBLIC DNS Zone <- rotas com ingress-type=public ----
  public:
    enabled: true
    name: public
    routerName: public              # DEVE casar com ingress.public.name
    domain: "cgibs.gov.br"          # DEVE casar com ingress.public.domain
    resourceGroup: "<PREENCHER>"    # RG da Azure DNS Zone pública
    # az network dns zone show -n cgibs.gov.br -g <rg> --query id -o tsv
    zoneId: "<PREENCHER>"           # .../providers/Microsoft.Network/dnszones/cgibs.gov.br
    # pri.cgibs.gov.br é SUBDOMÍNIO de cgibs.gov.br: sem esta exclusão o filtro
    # da instância pública também casaria com os hosts privados.
    excludeDomains:
      - "pri.cgibs.gov.br"
    configSecretName: azure-config-file-public

# =============================================================================
#  6. NSG RULE -- sincroniza a regra inbound do NSG com o IP do LB do ingress
# =============================================================================
#  Apos a criacao do IngressController (wave 30), o Load Balancer publico da
#  Azure recebe um IP dinamico. Para o trafego chegar, o NSG da subnet precisa
#  de uma inbound rule permitindo TCP 80/443 do Internet para esse IP.
#
#  Este bloco liga um CronJob (wave 50) que:
#    1. espera o Service router-<nome> ter IP (ate ~25 min);
#    2. autentica na Azure com o Service Principal (Secret azure-spn, criado
#       pelo docs/cliente/scripts/criar-secrets-day2.sh -- nunca vai pro Git);
#    3. cria/atualiza a regra Allow_HTTP_HTTPS_Ingress no NSG, idempotente.
#
#  O CronJob roda a cada 10 min e se auto-cura se o LB for recriado com outro IP.
nsgRule:
  enabled: false                    # <-- vire para true SÓ depois de preencher tudo abaixo

  # Service do IngressController cujo IP publico vai para a regra do NSG.
  # SEM o clusterName: o template acrescenta o sufixo sozinho.
  #   aqui         : router-public          (o mesmo nome de ingress.public.name)
  #   Service real : router-public-<clusterName>
  serviceName: router-public
  serviceNamespace: openshift-ingress

  # NSG alvo na Azure.
  nsgName: "<PREENCHER>"            # ex: azr-cliente-dev-01-nsg
  nsgResourceGroup: "<PREENCHER>"   # RG onde vive o NSG
  subscriptionId: "<PREENCHER>"
  ruleName: Allow_HTTP_HTTPS_Ingress
  priority: 1000
  schedule: "*/10 * * * *"
  timeoutSeconds: 1800

  image: mcr.microsoft.com/azure-cli
  imageTag: latest

  # Secret com clientId/clientSecret/tenantId do Service Principal (fora do Git).
  secretName: azure-spn
  namespace: nsg-rule

# =============================================================================
#  7. AUTOSCALING DE CLUSTER -- ClusterAutoscaler + MachineAutoscaler
# =============================================================================
#  Liga o autoscaling de máquinas do pool worker: o cluster-autoscaler-operator
#  escala os MachineSets entre min e max conforme a demanda das pods.
#
#  Requisito: o cluster JÁ PRECISA ESTAR PROVISIONADO (provision.enabled=true e
#  o cluster de pé) para descobrir os nomes reais dos MachineSets:
#
#      oc get machineset -n openshift-machine-api
#
#  Exemplo de saída (IPI Azure, zona brazilsouth):
#      azr-cliente-dev-01-worker-brazilsouth1
#      azr-cliente-dev-01-worker-brazilsouth2
#      azr-cliente-dev-01-worker-brazilsouth3
#
#  Copie os nomes para machineSets[].name, defina min/max e vire enabled: true.
#  O ClusterAutoscaler global (scale-down etc.) nasce com defaults seguros.
autoscaling:
  enabled: false                    # <-- vire para true SÓ depois de preencher machineSets

  # Configuração GLOBAL do autoscaler (CR "default").
  clusterAutoscaler:
    maxNodesTotal: 20
    scaleDown:
      enabled: true
      unneededTime: 10m
      delayAfterAdd: 10m
      delayAfterDelete: 10m
      delayAfterFailure: 10m

  # Um MachineAutoscaler por MachineSet do pool worker.
  machineSets:
    - name: "<PREENCHER>"           # ex: azr-cliente-dev-01-worker-brazilsouth1
      minReplicas: 2
      maxReplicas: 6
    - name: "<PREENCHER>"           # ex: azr-cliente-dev-01-worker-brazilsouth2
      minReplicas: 2
      maxReplicas: 6
    - name: "<PREENCHER>"           # ex: azr-cliente-dev-01-worker-brazilsouth3
      minReplicas: 2
      maxReplicas: 6

# ═══════════════ 8. IDENTITY PROVIDER (OAuth do cluster) ═══════════════
# =============================================================================
#  Configura os identity providers do OAuth do cluster (objeto OAuth/cluster).
#
#  ATENÇÃO -- a lista abaixo SUBSTITUI o spec.identityProviders do cluster.
#  É uma lista atômica: provider adicionado pela console é removido no próximo
#  sync (selfHeal). Todo provider tem que estar declarado aqui.
#
#  O CLIENT SECRET NÃO VAI PARA O GIT. Ele vive no Secret referenciado em
#  openID.clientSecret.name, no namespace openshift-config, criado por:
#      ./docs/cliente/scripts/criar-secrets-day2.sh clusters/<cluster>/values.yaml
#
#  Registro da aplicação no Entra ID (uma vez, pelo time de identidade):
#    - Redirect URI (Web):
#        https://oauth-openshift.apps.<cluster>.cgibs.gov.br/oauth2callback/<name>
#      onde <name> é EXATAMENTE o campo name do provider abaixo.
#    - Token configuration: adicione o claim opcional "groups" (senão o claim
#      groups vem vazio e nenhum RoleBinding por grupo funciona).
#    - Anote Application (client) ID e Directory (tenant) ID.
#
#  Depois do sync o authentication-operator reinicia o oauth-server: o login
#  fica fora por ~1 minuto. Valide ANTES de mexer no kubeadmin.
# =============================================================================
identityProvider:
  enabled: false                    # <-- vire para true só depois de preencher

  providers:
    - name: RTC_EntraID             # entra na URL de callback -- não mude depois
      type: OpenID
      mappingMethod: claim
      openID:
        clientID: "<PREENCHER>"     # Application (client) ID do registro no Entra ID
        clientSecret:
          name: openid-client-secret        # Secret em openshift-config (fora do Git)
        issuer: "https://login.microsoftonline.com/<PREENCHER>/v2.0"   # <tenant-id>
        extraScopes:
          - profile
          - openid
        claims:
          preferredUsername:
            - preferred_username
          name:
            - name
          email:
            - email
          groups:
            - groups
