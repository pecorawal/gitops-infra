# =============================================================================
#  MODELO DE CLUSTER -- copie este diretorio para criar um cluster novo
# =============================================================================
#  cp -r clusters/azr-cliente-dev-01 clusters/<seu-cluster>
#  # edite clusters/<seu-cluster>/values.yaml
#  ./docs/cliente/scripts/verificar-values.sh <seu-cluster>
#  git add clusters/<seu-cluster> && git commit && git push
#
#  CONVENCAO DOS PLACEHOLDERS
#    Tudo entre <MAIUSCULAS> precisa ser substituido. Os charts FALHAM o render
#    se sobrar algum, entao um esquecimento aparece como erro na Application, e
#    nao como cluster instalado errado.
#
#  DUAS REGRAS QUE JA CUSTARAM CARO
#    1. NUNCA use uma linha "---" neste arquivo. Ela inicia um segundo
#       documento YAML e o Helm le apenas o PRIMEIRO: tudo abaixo e ignorado em
#       silencio. Para separar secoes, use somente comentarios (#).
#    2. O nome do diretorio em clusters/ tem que ser IGUAL a clusterName.
#
#  ORDEM DE ATIVACAO -- ligue um bloco por vez, confirmando cada camada:
#    provision -> operators -> certManager -> ingress -> externalDNS
#              -> nsgRule -> autoscaling -> identityProvider
# =============================================================================

# ---- IDENTIDADE -------------------------------------------------------------
clusterName: "azr-cliente-dev-01"   # == nome deste diretorio
environment: dev                    # rotulo livre (dev, des, hml, prd...)

# Dominio base do cluster. E dele que saem api.<cluster>.<baseDomain> e
# *.apps.<cluster>.<baseDomain>. Em cluster privado costuma ser o dominio da
# Private DNS Zone. ex: pri.example.com
baseDomain: "<BASE_DOMAIN>"

# ManagedClusterSet do ACM. Preenchido aqui, ignora o mapeamento por labels.env.
# Vazio = resolvido por clusterSets.byEnv abaixo. ex: non-pro | pro
clusterSet: "<CLUSTER_SET>"
clusterSets:
  default: ""
  byEnv: {}

cloudProvider: Azure

labels:
  env: "dev"                        # usado por clusterSets.byEnv quando clusterSet e vazio
  region: "<AZURE_REGION>"          # ex: brazilsouth
  vendor: "OpenShift"
  cloud: "Azure"
  criticality: "high"
  # NAO REMOVA: e ela que faz o ACM registrar este cluster como destino de
  # deploy no ArgoCD (via GitOpsCluster + Placement).
  apps.open-cluster-management.io/replicate-to-argocd: "true"

addons:
  policyController: true
  searchCollector: true
  applicationManager: true
  certPolicyController: true

# =============================================================================
#  1. PROVISIONAMENTO (Hive / openshift-install)
# =============================================================================
provision:
  enabled: false                    # <-- true so com TUDO abaixo preenchido

  # oc get clusterimageset      ex: img4.18.20-multi-appsub
  imageSetRef: "<CLUSTER_IMAGE_SET>"

  credentials:
    mode: existing                  # existing | externalSecret (este exige o ESO)
    # Namespace e nome da Credential compartilhada do ACM (origem).
    sourceNamespace: "<ACM_CREDENTIALS_NAMESPACE>"   # ex: acm-credentials
    sourceSecret: "<ACM_CREDENTIAL_NAME>"            # ex: azure-hub
    refreshInterval: "1h"
    copySshKey: false               # SO no modo externalSecret
    # false remove o bloco sshPrivateKeySecretRef inteiro do ClusterDeployment
    # (cluster sem acesso SSH aos nos).
    sshPrivateKey: true
    # Secrets JA existentes no namespace do cluster, no hub. Vazio = a
    # convencao <cluster>-azure-creds / <cluster>-pull-secret.
    # Criados por docs/cliente/scripts/preparar-credenciais.sh
    existingCredentialsSecret: "<HUB_AZURE_CREDS_SECRET>"    # ex: azure-hub
    existingPullSecret: "<HUB_PULL_SECRET>"                  # ex: azure-hub
    existingSshPrivateKeySecret: "<HUB_SSH_SECRET>"          # ex: azure-hub

  # Nome do pool de workers. Define o MachinePool (<cluster>-<nome>) e os
  # MachineSets (<infraID>-<nome>-<zona>).
  # spec.platform do MachinePool e IMUTAVEL: para corrigir a rede depois,
  # troca-se este nome (worker-v2, worker-v3...) e drena-se o pool antigo.
  machinePool:
    name: worker

  publish: Internal                 # Internal = cluster privado | External
  fips: false
  preserveOnDelete: false           # true = apagar o ClusterDeployment NAO destroi a Azure
  acmImport:
    enabled: true

  azure:
    region: "<AZURE_REGION>"                    # ex: brazilsouth
    cloudName: AzurePublicCloud
    # RG da Azure DNS Zone PUBLICA (a do baseDomain publico)
    baseDomainResourceGroupName: "<DNS_RESOURCE_GROUP>"   # ex: rg-dns

    # ---- BYO VNet: rede PRE-EXISTENTE ----
    # Deixe os quatro vazios para o instalador criar a rede sozinho.
    # ATENCAO: estes valores tambem vao para o MachinePool -- sem eles, cada
    # maquina NOVA falha com ResourceNotFound apontando para uma VNet que o
    # instalador criaria e que nao existe.
    networkResourceGroupName: "<VNET_RESOURCE_GROUP>"  # ex: rg-rede
    virtualNetwork: "<VNET_NAME>"                      # ex: vnet-hub
    controlPlaneSubnet: "<MASTER_SUBNET>"              # ex: subnet-master
    computeSubnet: "<WORKER_SUBNET>"                   # ex: subnet-worker
    outboundType: Loadbalancer                         # Loadbalancer | UserDefinedRouting

  networking:
    networkType: OVNKubernetes
    # Aceitam escalar (forma curta) ou lista (forma do install-config).
    clusterNetwork: "10.128.0.0/14"
    hostPrefix: 23
    serviceNetwork: "172.30.0.0/16"
    machineNetwork: "<VNET_CIDR>"   # address space da VNet. ex: 10.0.0.0/16

  controlPlane:
    replicas: 3
    type: Standard_D8s_v3
    osDisk:
      diskSizeGB: 1024
      diskType: Premium_LRS
    zones: ["1", "2", "3"]

  compute:
    replicas: 3                     # ignorado quando autoscaling.enabled = true
    type: Standard_D4s_v3
    osDisk:
      diskSizeGB: 512
      diskType: Premium_LRS
    zones: ["1", "2", "3"]

# =============================================================================
#  2. OPERATORS -- instalados no cluster provisionado (spoke)
# =============================================================================
operators:
  enabled: false

  certManager:
    channel: stable-v1
    source: redhat-operators

  externalDNS:
    channel: stable-v1
    source: redhat-operators

  # Operadores adicionais, sem mexer no chart: cada entrada gera Namespace,
  # OperatorGroup e Subscription. UM namespace por operador.
  # NAO serve para componentes do payload do OpenShift (cluster-autoscaler,
  # machine-api, ingress): eles ja vem instalados e nao tem packagemanifest.
  #   oc get packagemanifest -n openshift-marketplace | grep -i <termo>
  extra: []
    # - name: kubernetes-nmstate-operator
    #   namespace: openshift-nmstate
    #   channel: stable
    #   installMode: OwnNamespace      # OwnNamespace | AllNamespaces

# =============================================================================
#  3. CERT-MANAGER -- ClusterIssuer e certificados
# =============================================================================
certManager:
  enabled: false

  # Overrides do OPERANDO (CR CertManager/cluster).
  # OBRIGATORIO em cluster privado: sem resolvers publicos, a auto-checagem do
  # desafio DNS01 cai no DNS da VNet, nao acha o TXT na zona publica, e o
  # Certificate trava em "Waiting for DNS-01 challenge propagation".
  operatorConfig:
    enabled: true
    managementState: Managed
    logLevel: Normal
    operatorLogLevel: Normal
    controller:
      overrideArgs:
        - "--dns01-recursive-nameservers-only"
        - "--dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53"
      overrideEnv: []
      overrideResources: {}
    webhook:
      overrideArgs: []
    cainjector:
      overrideArgs: []

  # ClusterIssuer letsencrypt-prod: ACME com desafio DNS01 na Azure DNS Zone
  # PUBLICA. E ele que emite os DOIS wildcards -- inclusive o do dominio
  # privado, porque o desafio so precisa gravar o TXT _acme-challenge na zona
  # publica; o nome final continua resolvendo apenas na Private DNS Zone.
  #
  # REQUISITO: o dominio privado NAO pode estar delegado publicamente a outro
  # servidor. Confirme com: dig +short NS <PRIVATE_DOMAIN>   (nao deve responder)
  acme:
    enabled: true
    email: "<ACME_EMAIL>"           # ex: plataforma@example.com
    # Producao:
    server: "https://acme-v02.api.letsencrypt.org/directory"
    # Staging (nao conta na cota, cert nao confiavel) -- use enquanto testa:
    # server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    azureDNS:
      subscriptionID: "<AZURE_SUBSCRIPTION_ID>"   # az account show --query id -o tsv
      tenantID: "<AZURE_TENANT_ID>"               # az account show --query tenantId -o tsv
      resourceGroupName: "<DNS_RESOURCE_GROUP>"   # RG da zona PUBLICA. ex: rg-dns
      hostedZoneName: "<PUBLIC_DOMAIN>"           # zona publica. ex: example.com
      environment: AzurePublicCloud
      clientID: "<AZURE_SP_CLIENT_ID>"            # appId do Service Principal
      # O clientSecret NUNCA vai para o Git: vem do Secret abaixo, criado no
      # namespace cert-manager por docs/cliente/scripts/criar-secrets-day2.sh
      clientSecretRef:
        name: azuredns-config
        key: client-secret

  # CA interna -- desligada nesta arquitetura (os dois ingress usam ACME).
  internalCA:
    enabled: false
    selfSigned: true
    caSecretName: internal-ca-key-pair
    commonName: "<ORG> Internal CA"  # ex: ACME Corp Internal CA
    durationHours: 87600

  # Certificados de aplicacao. Os wildcards ja cobrem qualquer host de um nivel
  # sob os dois dominios -- declare aqui so quem precisa de certificado PROPRIO.
  appCertificates: []
    # - name: checkout-tls
    #   namespace: pagamentos
    #   issuer: letsencrypt-prod
    #   secretName: checkout-tls
    #   dnsNames:
    #     - "checkout.<PRIVATE_DOMAIN>"

# =============================================================================
#  4. INGRESS CONTROLLERS -- um privado e um publico, alem do default
# =============================================================================
#  Separacao pela label "ingress-type" na Route:
#    ingress-type: private   -> IC private-<cluster>  -> LB interno -> Private DNS
#    ingress-type: public    -> IC public-<cluster>   -> LB publico -> Azure DNS
#    outro valor / sem label -> IC default (console, oauth, plataforma)
ingress:
  enabled: false                    # <-- INTERRUPTOR MESTRE do bloco

  default:
    # O default passa a admitir apenas Routes cuja label ingress-type seja
    # DIFERENTE de public e private (NotIn casa tambem com Routes SEM a label,
    # entao console e oauth continuam aqui).
    isolateByLabel: true

    # ESCOPO DO LB DO ROUTER DEFAULT. Cluster privado = Internal.
    # NUNCA External num cluster privado: o LB seria recriado como publico,
    # com IP novo, e o acesso interno a console cairia.
    scope: Internal

    labelKey: ingress-type
    reservedValues:
      - public
      - private

  # ---- PRIVADO: Load Balancer interno da Azure ----
  # Nome final do IngressController: private-<clusterName>
  private:
    enabled: true
    name: private
    domain: "<PRIVATE_DOMAIN>"      # dominio da Private DNS Zone. ex: pri.example.com
    replicas: 2
    scope: Internal
    routeSelector:
      key: ingress-type
      value: private
    namespaceSelector: {}
    nodePlacement: {}
    certificate:
      enabled: true
      issuer: letsencrypt-prod
      secretName: private-ingress-tls

  # ---- PUBLICO: Load Balancer publico da Azure ----
  # Nome final do IngressController: public-<clusterName>
  public:
    enabled: true
    name: public
    domain: "<PUBLIC_DOMAIN>"       # dominio da zona publica. ex: example.com
    replicas: 2
    scope: External
    routeSelector:
      key: ingress-type
      value: public
    namespaceSelector: {}
    nodePlacement: {}
    certificate:
      enabled: true
      issuer: letsencrypt-prod
      secretName: public-ingress-tls

# =============================================================================
#  5. EXTERNAL DNS -- uma instancia por zona / por IngressController
# =============================================================================
#  routerName recebe o sufixo -<clusterName> automaticamente, para casar com o
#  nome do IngressController. NAO acrescente o sufixo aqui.
externalDNS:
  enabled: false                    # <-- INTERRUPTOR MESTRE do bloco

  azure:
    subscriptionId: "<AZURE_SUBSCRIPTION_ID>"
    tenantId: "<AZURE_TENANT_ID>"
    aadClientId: "<AZURE_SP_CLIENT_ID>"
    # DEIXE SEMPRE VAZIO NO GIT. Os Secrets azure.json (um por zona) sao
    # criados por docs/cliente/scripts/criar-secrets-day2.sh.
    aadClientSecret: ""

  # ---- Azure PRIVATE DNS Zone <- rotas com ingress-type=private ----
  private:
    enabled: true
    name: private
    routerName: private             # DEVE casar com ingress.private.name
    domain: "<PRIVATE_DOMAIN>"      # DEVE casar com ingress.private.domain
    resourceGroup: "<PRIVATE_DNS_RESOURCE_GROUP>"   # RG da Private DNS Zone
    # az network private-dns zone show -n <PRIVATE_DOMAIN> -g <rg> --query id -o tsv
    zoneId: "<PRIVATE_DNS_ZONE_ID>"
    excludeDomains: []
    configSecretName: azure-config-file-private

  # ---- Azure PUBLIC DNS Zone <- rotas com ingress-type=public ----
  public:
    enabled: true
    name: public
    routerName: public              # DEVE casar com ingress.public.name
    domain: "<PUBLIC_DOMAIN>"       # DEVE casar com ingress.public.domain
    resourceGroup: "<DNS_RESOURCE_GROUP>"
    # az network dns zone show -n <PUBLIC_DOMAIN> -g <rg> --query id -o tsv
    zoneId: "<PUBLIC_DNS_ZONE_ID>"
    # Se o dominio privado for SUBDOMINIO do publico, exclua-o aqui -- senao o
    # filtro da instancia publica tambem casaria com os hosts privados.
    excludeDomains:
      - "<PRIVATE_DOMAIN>"
    configSecretName: azure-config-file-public

# =============================================================================
#  6. NSG RULE -- regra de entrada para o ingress publico (opcional)
# =============================================================================
#  Um CronJob le o IP do LB do IngressController publico e faz upsert de uma
#  inbound rule (TCP 80/443 da Internet) no NSG, alem de associar o NSG a
#  subnet dos workers -- cluster IPI privado nasce SEM NSG na subnet, e sem a
#  associacao a regra nao surte efeito nenhum.
#
#  ANTES DE LIGAR:
#   1. o Service Principal precisa de "Network Contributor" no RG do NSG E no
#      RG da VNet
#   2. ligue enabled: true NESTE arquivo e rode, logado no spoke:
#        ./docs/cliente/scripts/criar-secrets-day2.sh clusters/<cluster>/values.yaml
#      (o script pula esta etapa se enabled estiver false)
#   3. so entao commite
nsgRule:
  enabled: false

  # Service do router. SEM o clusterName: o template acrescenta o sufixo.
  #   aqui         : router-public
  #   Service real : router-public-<clusterName>
  serviceName: router-public
  serviceNamespace: openshift-ingress

  nsgName: "<NSG_NAME>"                       # az network nsg list -g <rg> -o table
  nsgResourceGroup: "<NSG_RESOURCE_GROUP>"
  subscriptionId: "<AZURE_SUBSCRIPTION_ID>"
  ruleName: Allow_HTTP_HTTPS_Ingress
  priority: 1000
  schedule: "*/10 * * * *"

  # Espera pelo IP do LB. MENOR que o intervalo do schedule, senao uma execucao
  # ainda estaria rodando quando a proxima dispara.
  waitSeconds: 180
  timeoutSeconds: 600               # corte duro do Job; > waitSeconds

  # Associacao do NSG a subnet dos WORKERS.
  # Vazio = reaproveita o que provision.azure ja declara.
  subnet:
    associate: true
    name: ""
    vnet: ""
    resourceGroup: ""
    # Se a subnet ja tiver OUTRO NSG, o script avisa e para -- trocar
    # substituiria todas as regras que valem para a subnet inteira.
    force: false

  image: mcr.microsoft.com/azure-cli
  imageTag: latest
  secretName: azure-spn
  namespace: nsg-rule

# =============================================================================
#  7. AUTOSCALING
# =============================================================================
#  Em cluster gerenciado pelo ACM o autoscaling NAO se configura criando
#  MachineAutoscaler no spoke: quem manda nos MachineSets e o MachinePool do
#  Hive, no hub. O Hive cria os MachineAutoscaler; o ClusterAutoscaler global
#  vem por esta esteira.
#
#  min e max sao TOTAIS do pool worker, e o Hive reparte entre as zonas.
#  Com 3 zonas e minReplicas 3, cada MachineSet fica com min 1 -- e um
#  MachineSet no proprio piso nao pode encolher (motivo comum de "nao fez
#  scale-down").
#
#  spec.replicas e spec.autoscaling sao mutuamente exclusivos no Hive: com
#  enabled: true, provision.compute.replicas deixa de valer.
autoscaling:
  enabled: false

  mode: machinePool                 # machinePool = ACM/Hive | spoke = cluster sem Hive

  minReplicas: 3                    # >= numero de zonas, ou 0
  maxReplicas: 9

  # CR global ClusterAutoscaler -- vale nos DOIS modos. Sem ele o autoscaler
  # nao e ligado e nada escala.
  clusterAutoscaler:
    maxNodesTotal: 20
    scaleDown:
      enabled: true
      unneededTime: 10m             # tempo ocioso antes de virar candidato
      delayAfterAdd: 10m
      delayAfterDelete: 10m
      delayAfterFailure: 10m

  # Usado SOMENTE com mode: spoke.
  #   oc get machineset -n openshift-machine-api
  machineSets: []
    # - name: <infraID>-worker-<zona>
    #   minReplicas: 2
    #   maxReplicas: 6

# =============================================================================
#  8. IDENTITY PROVIDER (OAuth do cluster)
# =============================================================================
#  ANTES DE LIGAR:
#   1. REGISTRO DE APLICACAO no provedor (ex: Microsoft Entra ID)
#      Redirect URI (tipo Web), terminando com o "name" do provider abaixo:
#        https://oauth-openshift.apps.<cluster>.<baseDomain>/oauth2callback/<PROVIDER_NAME>
#      Confirme o host real (a rota oauth fica no IngressController DEFAULT):
#        oc get route oauth-openshift -n openshift-authentication \
#          -o jsonpath='{.spec.host}{"\n"}'
#      Adicione o claim opcional "groups" -- sem ele nenhum RoleBinding por
#      grupo funciona.
#   2. SECRET NO CLUSTER, em openshift-config, chave obrigatoriamente
#      chamada clientSecret:
#        oc create secret generic openid-client-secret -n openshift-config \
#          --from-literal=clientSecret='<segredo>'
#   3. A lista abaixo SUBSTITUI spec.identityProviders do cluster -- e atomica.
#      Ao sincronizar, o login fica indisponivel por ~1 minuto.
#      NAO remova o kubeadmin antes de validar o login novo.
identityProvider:
  enabled: false

  providers:
    - name: "<PROVIDER_NAME>"       # entra na URL de callback. ex: CorpEntraID
      type: OpenID
      mappingMethod: claim
      openID:
        clientID: "<OIDC_CLIENT_ID>"          # Application (client) ID
        clientSecret:
          name: openid-client-secret
        # ex: https://login.microsoftonline.com/<AZURE_TENANT_ID>/v2.0
        issuer: "<OIDC_ISSUER_URL>"
        extraScopes:
          - profile
          - openid
        claims:
          preferredUsername:
            - preferred_username
          name:
            - name
          email:
            - email
          groups:
            - groups
