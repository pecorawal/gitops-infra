{{- if .Values.nsgRule.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nsg-rule-svc-reader
  namespace: {{ .Values.nsgRule.serviceNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nsg-rule-svc-reader
subjects:
  - kind: ServiceAccount
    name: nsg-rule-sa
    namespace: {{ .Values.nsgRule.namespace }}
{{- end }}
