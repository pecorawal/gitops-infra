{{- if .Values.operators.enabled }}
# ExternalDNS Operator for Red Hat OpenShift.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: external-dns-operator
  namespace: external-dns-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: external-dns-operator
  namespace: external-dns-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  name: external-dns-operator
  channel: {{ .Values.operators.externalDNS.channel }}
  source: {{ .Values.operators.externalDNS.source }}
  sourceNamespace: {{ .Values.operators.externalDNS.sourceNamespace }}
  installPlanApproval: {{ .Values.operators.externalDNS.installPlanApproval }}
{{- end }}
