# Valores injetados pelo ApplicationSet (bootstrap/02-appset-main.yaml).
# Nao edite aqui -- o arquivo do main e clusters/<cluster>/values.yaml.
autoscaling:
  enabled: false
  # machinePool (padrao) -> ACM/Hive: o autoscaling vai no MachinePool, no hub,
  #                         e este chart NAO e usado.
  # spoke                -> cluster sem Hive: os CRs abaixo vao direto no cluster.
  mode: machinePool

  # Configuracao GLOBAL do cluster-autoscaler (CR "default", unico aceito).
  clusterAutoscaler:
    maxNodesTotal: 20
    scaleDown:
      enabled: true
      unneededTime: 10m
      delayAfterAdd: 10m
      delayAfterDelete: 10m
      delayAfterFailure: 10m

  # Um MachineAutoscaler por MachineSet do pool worker.
  # Descubra os nomes reais com: oc get machineset -n openshift-machine-api
  machineSets: []
  #  - name: <cluster>-worker-<region>-<zone>   # ex: azr-main-dev-01-worker-brazilsouth1
  #    minReplicas: 2
  #    maxReplicas: 6

# Lido apenas para decidir se o ClusterAutoscaler global sai: basta um pool
# adicional com autoscaling.enabled. Os MachinePools em si sao do chart
# machine-pools, no hub.
machinePools:
  enabled: false
  pools: []
