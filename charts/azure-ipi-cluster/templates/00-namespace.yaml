{{- if .Values.provision.enabled }}
{{- /*
  ===========================================================================
   GUARDA CONTRA <PREENCHER> ESQUECIDO
  ---------------------------------------------------------------------------
   Roda aqui, no primeiro objeto do chart, para abortar o render inteiro antes
   de qualquer coisa ser aplicada.

   "required" do Helm so barra valor vazio -- o placeholder <PREENCHER> passa
   por ser uma string valida. Sem esta checagem o ClusterDeployment seria
   aplicado com "<PREENCHER>" no lugar do resource group, e a falha so
   apareceria minutos depois, num log do Job de instalacao do Hive.
  ===========================================================================
*/}}
{{- $campos := dict
  "baseDomain"                                   .Values.baseDomain
  "provision.imageSetRef"                        .Values.provision.imageSetRef
  "provision.azure.region"                       .Values.provision.azure.region
  "provision.azure.baseDomainResourceGroupName"  .Values.provision.azure.baseDomainResourceGroupName
  "provision.networking.machineNetwork"          .Values.provision.networking.machineNetwork
}}
{{- if eq .Values.provision.credentials.mode "externalSecret" }}
  {{- $_ := set $campos "provision.credentials.sourceSecret"    .Values.provision.credentials.sourceSecret }}
  {{- $_ := set $campos "provision.credentials.sourceNamespace" .Values.provision.credentials.sourceNamespace }}
{{- end }}
{{- if .Values.provision.azure.virtualNetwork }}
  {{- $_ := set $campos "provision.azure.networkResourceGroupName" .Values.provision.azure.networkResourceGroupName }}
  {{- $_ := set $campos "provision.azure.controlPlaneSubnet"       .Values.provision.azure.controlPlaneSubnet }}
  {{- $_ := set $campos "provision.azure.computeSubnet"            .Values.provision.azure.computeSubnet }}
{{- end }}
{{- $pendentes := list }}
{{- range $chave, $valor := $campos }}
  {{- if or (not $valor) (contains "<PREENCHER>" (toString $valor)) }}
    {{- $pendentes = append $pendentes $chave }}
  {{- end }}
{{- end }}
{{- if $pendentes }}
  {{- fail (printf "\n\nCluster %q: %d valor(es) ainda por preencher em clusters/%s/values.yaml:\n  - %s\n\nPreencha antes de deixar provision.enabled: true, senao o Hive iniciaria a\ninstalacao com placeholders e so falharia no log do Job, minutos depois.\n" .Values.clusterName (len $pendentes) .Values.clusterName (join "\n  - " (sortAlpha $pendentes))) }}
{{- end }}
# Namespace do cluster no hub. Abriga a Credential do ACM, o ClusterDeployment
# e todos os objetos do Hive.
# Duas protecoes DIFERENTES, ambas necessarias:
#   Prune=false   nao remove quando o objeto sai do estado desejado (sync)
#   Delete=false  nao remove quando a Application e apagada (delecao em cascata)
# Prune=false sozinho NAO protege de cascata -- foi assim que este namespace,
# junto com a Credential e o ClusterDeployment dentro dele, podia desaparecer.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.clusterName }}
  labels:
    cluster.open-cluster-management.io/managedCluster: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
