{{- if and .Values.provision.enabled (eq .Values.provision.credentials.mode "externalSecret") }}
{{- $c := .Values.provision.credentials }}
# ---------------------------------------------------------------------------
#  COPIA DA CREDENTIAL COMPARTILHADA DO ACM PARA O NAMESPACE DO CLUSTER
# ---------------------------------------------------------------------------
#  Uma unica Credential do ACM (namespace {{ $c.sourceNamespace }}) atende todos
#  os provisionamentos. O ExternalSecret abaixo a le atraves do ClusterSecretStore
#  "{{ $c.clusterSecretStore }}" (bootstrap/05-acm-credentials-store.yaml) e a
#  materializa aqui, ja nos formatos que o Hive exige.
#
#  Nada de segredo passa pelo Git: o que esta versionado e o NOME da Credential.
#
#  dataFrom.extract traz TODAS as chaves da Credential como variaveis de
#  template. Usamos "index . <chave>" porque as chaves tem ponto no nome
#  (osServicePrincipal.json), o que quebraria a notacao {{ .chave }}.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-azure-creds
  namespace: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $c.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $c.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "azure-ipi-cluster.azureCredsSecret" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Lido por spec.platform.azure.credentialsSecretRef
        osServicePrincipal.json: '{{`{{ index . "osServicePrincipal.json" }}`}}'
        {{- if $c.copySshKey }}
        # Lido por spec.provisioning.sshPrivateKeySecretRef
        ssh-privatekey: '{{`{{ index . "ssh-privatekey" | default "" }}`}}'
        {{- end }}
  dataFrom:
    - extract:
        key: {{ required "provision.credentials.sourceSecret e obrigatorio quando credentials.mode=externalSecret" $c.sourceSecret }}
---
# O Hive exige o pull secret no formato kubernetes.io/dockerconfigjson (chave
# .dockerconfigjson), mas a Credential do ACM guarda em texto na chave
# "pullSecret". A conversao acontece aqui -- e o que antes era um
# "oc create secret docker-registry" manual por cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-pull-secret
  namespace: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $c.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $c.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "azure-ipi-cluster.pullSecret" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{`{{ index . "pullSecret" }}`}}'
  dataFrom:
    - extract:
        key: {{ $c.sourceSecret }}
{{- end }}
