{{- if and .Values.provision.enabled (eq .Values.provision.credentials.mode "externalSecret") }}
{{- /*
  ===========================================================================
   NOMES DOS SECRETS DE CREDENCIAL QUE O HIVE CONSOME
  ---------------------------------------------------------------------------
   O Hive so le Secrets do NAMESPACE do ClusterDeployment. Como a Credential do
   ACM e uma so, compartilhada por todos os provisionamentos, ela precisa ser
   materializada em cada namespace <clusterName>:

     <cluster>-azure-creds   Opaque            osServicePrincipal.json (+ ssh-privatekey)
     <cluster>-pull-secret   dockerconfigjson  .dockerconfigjson

   modo "existing" (padrao): os Secrets ja existem no namespace do cluster,
     criados por docs/cliente/scripts/preparar-credenciais.sh a partir da
     Credential compartilhada do ACM. Seguem a MESMA convencao de nome, entao
     nao e preciso informar nada -- os campos existing* sao apenas para nomes
     fora do padrao.

   modo "externalSecret": o ExternalSecret copia a Credential compartilhada e
     ja entrega os dois formatos exigidos pelo Hive.

   O "fail" NAO e decorativo: sem ele, um clusterName vazio produzia um ref
   VAZIO e o webhook do Hive recusava o ClusterDeployment com
     spec.platform.azure.credentialsSecretRef.name: Required value
   -- um erro que nao dizia qual valor faltava.

   NOTA: bloco IDENTICO ao de 03-clusterdeployment.yaml. Ao mudar um, mude o outro.
  ===========================================================================
*/}}
{{- $azureCredsSecret := "" }}
{{- if and (eq .Values.provision.credentials.mode "existing") .Values.provision.credentials.existingCredentialsSecret }}
  {{- $azureCredsSecret = .Values.provision.credentials.existingCredentialsSecret }}
{{- else if .Values.clusterName }}
  {{- $azureCredsSecret = printf "%s-azure-creds" .Values.clusterName }}
{{- end }}
{{- if not $azureCredsSecret }}
  {{- fail "\n\ncredentialsSecretRef ficaria VAZIO.\nclusterName esta vazio e provision.credentials.existingCredentialsSecret tambem.\nSem isso o webhook do Hive recusa o ClusterDeployment com\n  spec.platform.azure.credentialsSecretRef.name: Required value\n" }}
{{- end }}
{{- $pullSecret := "" }}
{{- if and (eq .Values.provision.credentials.mode "existing") .Values.provision.credentials.existingPullSecret }}
  {{- $pullSecret = .Values.provision.credentials.existingPullSecret }}
{{- else if .Values.clusterName }}
  {{- $pullSecret = printf "%s-pull-secret" .Values.clusterName }}
{{- end }}
{{- if not $pullSecret }}
  {{- fail "\n\npullSecretRef ficaria VAZIO. Verifique clusterName no values.yaml.\n" }}
{{- end }}
{{- /*
  Secret com ssh-privatekey. Por padrao e o MESMO do osServicePrincipal.json:
  o Hive le chaves diferentes de refs diferentes, e nada impede que apontem
  para o mesmo objeto.
*/}}
{{- $sshSecret := .Values.provision.credentials.existingSshPrivateKeySecret | default $azureCredsSecret }}
{{- $c := .Values.provision.credentials }}
# ---------------------------------------------------------------------------
#  COPIA DA CREDENTIAL COMPARTILHADA DO ACM PARA O NAMESPACE DO CLUSTER
# ---------------------------------------------------------------------------
#  Uma unica Credential do ACM (namespace {{ $c.sourceNamespace }}) atende todos
#  os provisionamentos. O ExternalSecret abaixo a le atraves do ClusterSecretStore
#  "{{ $c.clusterSecretStore }}" (bootstrap/05-acm-credentials-store.yaml) e a
#  materializa aqui, ja nos formatos que o Hive exige.
#
#  Nada de segredo passa pelo Git: o que esta versionado e o NOME da Credential.
#
#  dataFrom.extract traz TODAS as chaves da Credential como variaveis de
#  template. Usamos "index . <chave>" porque as chaves tem ponto no nome
#  (osServicePrincipal.json), o que quebraria a notacao {{ .chave }}.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-azure-creds
  namespace: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $c.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $c.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $azureCredsSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Lido por spec.platform.azure.credentialsSecretRef
        osServicePrincipal.json: '{{`{{ index . "osServicePrincipal.json" }}`}}'
        {{- if $c.copySshKey }}
        # Lido por spec.provisioning.sshPrivateKeySecretRef
        ssh-privatekey: '{{`{{ index . "ssh-privatekey" | default "" }}`}}'
        {{- end }}
  dataFrom:
    - extract:
        key: {{ required "provision.credentials.sourceSecret e obrigatorio quando credentials.mode=externalSecret" $c.sourceSecret }}
---
# O Hive exige o pull secret no formato kubernetes.io/dockerconfigjson (chave
# .dockerconfigjson), mas a Credential do ACM guarda em texto na chave
# "pullSecret". A conversao acontece aqui -- e o que antes era um
# "oc create secret docker-registry" manual por cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clusterName }}-pull-secret
  namespace: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $c.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $c.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $pullSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{`{{ index . "pullSecret" }}`}}'
  dataFrom:
    - extract:
        key: {{ $c.sourceSecret }}
{{- end }}
