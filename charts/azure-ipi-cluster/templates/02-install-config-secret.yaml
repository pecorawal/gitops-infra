{{- if .Values.provision.enabled }}
# ---------------------------------------------------------------------------
#  O MANIFESTO DO openshift-install
# ---------------------------------------------------------------------------
#  O conteudo de install-config.yaml abaixo e exatamente o que o
#  openshift-install usaria numa instalacao IPI manual. O Hive le este Secret e
#  dispara o instalador dentro de um Job no namespace do cluster, no hub.
#
#  pullSecret e sshKey ficam vazios de proposito: o Hive os substitui pelo
#  conteudo de spec.pullSecretRef e spec.provisioning.sshPrivateKeySecretRef do
#  ClusterDeployment. Nenhum segredo neste arquivo, nenhum segredo no Git.
#
#  ATENCAO A INDENTACAO: tudo abaixo de "install-config.yaml: |" e um bloco de
#  texto, e os 4 espacos iniciais fazem parte do YAML EXTERNO. Ao mexer aqui,
#  mantenha os 4 espacos de base -- o install-config comeca na coluna 5.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterName }}-install-config
  namespace: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  install-config.yaml: |
    apiVersion: v1
    metadata:
      name: {{ .Values.clusterName }}
    baseDomain: {{ .Values.baseDomain }}
    controlPlane:
      name: master
      architecture: amd64
      hyperthreading: Enabled
      replicas: {{ .Values.provision.controlPlane.replicas }}
      platform:
        azure:
          type: {{ .Values.provision.controlPlane.type }}
          osDisk:
            diskSizeGB: {{ .Values.provision.controlPlane.osDisk.diskSizeGB }}
            diskType: {{ .Values.provision.controlPlane.osDisk.diskType }}
          {{- with .Values.provision.controlPlane.zones }}
          zones:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    compute:
      - name: worker
        architecture: amd64
        hyperthreading: Enabled
        replicas: {{ .Values.provision.compute.replicas }}
        platform:
          azure:
            type: {{ .Values.provision.compute.type }}
            osDisk:
              diskSizeGB: {{ .Values.provision.compute.osDisk.diskSizeGB }}
              diskType: {{ .Values.provision.compute.osDisk.diskType }}
            {{- with .Values.provision.compute.zones }}
            zones:
              {{- toYaml . | nindent 14 }}
            {{- end }}
    networking:
      networkType: {{ .Values.provision.networking.networkType }}
      {{- /*
        Comentario de TEMPLATE (nao entra no install-config entregue ao Hive).

        Os tres campos abaixo aceitam DOIS formatos, porque o nome e igual ao do
        install-config, onde sao listas -- e e natural preenche-los assim:

          clusterNetwork: "10.128.0.0/14"        # escalar (forma curta)
          clusterNetwork:                        # lista (forma do install-config)
            - cidr: 10.128.0.0/14
              hostPrefix: 23

        Sem este tratamento, uma lista era interpolada como texto e virava
        "- cidr: [map[cidr:10.128.0.0/14]]", quebrando o YAML com
        "did not find expected ',' or ']'".
      */}}
      clusterNetwork:
      {{- if kindIs "slice" .Values.provision.networking.clusterNetwork }}
        {{- toYaml .Values.provision.networking.clusterNetwork | nindent 8 }}
      {{- else }}
        - cidr: {{ .Values.provision.networking.clusterNetwork }}
          hostPrefix: {{ .Values.provision.networking.hostPrefix }}
      {{- end }}
      machineNetwork:
      {{- if kindIs "slice" .Values.provision.networking.machineNetwork }}
        {{- toYaml .Values.provision.networking.machineNetwork | nindent 8 }}
      {{- else }}
        - cidr: {{ .Values.provision.networking.machineNetwork }}
      {{- end }}
      serviceNetwork:
      {{- if kindIs "slice" .Values.provision.networking.serviceNetwork }}
        {{- toYaml .Values.provision.networking.serviceNetwork | nindent 8 }}
      {{- else }}
        - {{ .Values.provision.networking.serviceNetwork }}
      {{- end }}
    platform:
      azure:
        region: {{ .Values.provision.azure.region }}
        cloudName: {{ .Values.provision.azure.cloudName }}
        baseDomainResourceGroupName: {{ .Values.provision.azure.baseDomainResourceGroupName }}
        {{- if .Values.provision.azure.virtualNetwork }}
        # ---- BYO VNet: instalador NAO cria rede, usa a existente ----
        networkResourceGroupName: {{ .Values.provision.azure.networkResourceGroupName }}
        virtualNetwork: {{ .Values.provision.azure.virtualNetwork }}
        controlPlaneSubnet: {{ .Values.provision.azure.controlPlaneSubnet }}
        computeSubnet: {{ .Values.provision.azure.computeSubnet }}
        {{- end }}
        outboundType: {{ .Values.provision.azure.outboundType }}
    publish: {{ .Values.provision.publish }}
    fips: {{ .Values.provision.fips }}
    pullSecret: ""
    sshKey: ""
{{- end }}
