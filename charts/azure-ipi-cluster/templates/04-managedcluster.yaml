{{- if .Values.provision.enabled }}
# Registra o cluster no ACM. Clusters provisionados pelo Hive sao importados
# automaticamente -- nao existe auto-import-secret / kubeconfig aqui, ao
# contrario de charts/import-cluster.
#
# Duas labels sao estruturais:
#
#   cluster.open-cluster-management.io/clusterset
#     define em qual ManagedClusterSet o cluster entra. Resolvida a partir de
#     labels.env pelo helper em _clusterset.tpl.
#
#   apps.open-cluster-management.io/replicate-to-argocd
#     faz o GitOpsCluster registrar este cluster como destino de deploy no
#     ArgoCD, o que habilita todas as Applications de day-2.
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: {{ .Values.clusterName }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    cloud: {{ .Values.cloudProvider | default "Azure" }}
    vendor: OpenShift
    cluster.open-cluster-management.io/clusterset: {{ include "azure-ipi-cluster.clusterSet" . }}
    apps.open-cluster-management.io/replicate-to-argocd: "true"
    {{- /* labels.env entra pelo bloco abaixo; nao repetir a chave aqui */}}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  hubAcceptsClient: true
{{- end }}
