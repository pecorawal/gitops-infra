{{- if and .Values.certManager.enabled .Values.ingress.private.enabled .Values.ingress.private.certificate.enabled }}
# Certificado wildcard do IngressController PRIVADO.
#
# O Certificate PRECISA estar no namespace openshift-ingress: e de la que o
# IngressController le o Secret referenciado em spec.defaultCertificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.private.certificate.secretName }}
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.ingress.private.certificate.secretName }}
  commonName: {{ printf "*.%s" .Values.ingress.private.domain | quote }}
  dnsNames:
    - {{ printf "*.%s" .Values.ingress.private.domain | quote }}
    - {{ .Values.ingress.private.domain | quote }}
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: {{ .Values.ingress.private.certificate.issuer }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
