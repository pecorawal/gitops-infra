{{- if and .Values.externalDNS.enabled .Values.externalDNS.azure.aadClientSecret .Values.externalDNS.private.enabled }}
# ---------------------------------------------------------------------------
#  Secret azure.json do ExternalDNS PRIVADO
# ---------------------------------------------------------------------------
#  Um Secret por zona, porque o resourceGroup da Private DNS Zone e o da DNS
#  Zone publica sao diferentes.
#
#  Renderizado SOMENTE quando externalDNS.azure.aadClientSecret esta preenchido
#  -- o que nunca deve acontecer no Git. Em operacao normal estes Secrets sao
#  criados fora do repositorio por docs/cliente/scripts/criar-secrets-day2.sh.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalDNS.private.configSecretName }}
  namespace: external-dns-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  azure.json: |
    {
      "tenantId": "{{ .Values.externalDNS.azure.tenantId }}",
      "subscriptionId": "{{ .Values.externalDNS.azure.subscriptionId }}",
      "resourceGroup": "{{ .Values.externalDNS.private.resourceGroup }}",
      "aadClientId": "{{ .Values.externalDNS.azure.aadClientId }}",
      "aadClientSecret": "{{ .Values.externalDNS.azure.aadClientSecret }}"
    }
{{- end }}
