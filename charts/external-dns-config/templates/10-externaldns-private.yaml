{{- if and .Values.externalDNS.enabled .Values.externalDNS.private.enabled }}
# ---------------------------------------------------------------------------
#  ExternalDNS PRIVADO
# ---------------------------------------------------------------------------
#  Publica as Routes admitidas pelo IngressController
#  "{{ .Values.externalDNS.private.routerName }}" na Azure PRIVATE DNS Zone.
#
#  Uma instancia por IngressController: openshiftRouteOptions.routerName faz o
#  ExternalDNS enxergar apenas as Routes daquele router e usar o hostname do
#  Load Balancer dele como alvo do registro.
#
#  O que separa a zona privada da publica NAO e o provider (Azure nos dois
#  casos) e sim o resource ID em spec.zones:
#    .../providers/Microsoft.Network/privateDnsZones/<zona> -> Private DNS
#    .../providers/Microsoft.Network/dnszones/<zona>        -> DNS publica
# ---------------------------------------------------------------------------
apiVersion: externaldns.olm.openshift.io/v1beta1
kind: ExternalDNS
metadata:
  name: {{ .Values.externalDNS.private.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    type: Azure
    azure:
      configFile:
        name: {{ .Values.externalDNS.private.configSecretName }}
  source:
    type: OpenShiftRoute
    openshiftRouteOptions:
      routerName: {{ .Values.externalDNS.private.routerName }}
    hostnameAnnotation: Ignore
  domains:
    - filterType: Include
      matchType: Pattern
      pattern: {{ printf ".*\\.%s" (.Values.externalDNS.private.domain | replace "." "\\.") | quote }}
    # Exclusoes. Necessarias quando o dominio de outro router e SUBDOMINIO
    # deste: sem excluir, o filtro .*\.cgibs\.gov\.br tambem casaria com
    # app.pri.cgibs.gov.br e as duas instancias disputariam o mesmo registro.
    {{- range .Values.externalDNS.private.excludeDomains }}
    - filterType: Exclude
      matchType: Pattern
      pattern: {{ printf ".*\\.%s" (. | replace "." "\\.") | quote }}
    {{- end }}
  zones:
    - {{ .Values.externalDNS.private.zoneId | quote }}
{{- end }}
