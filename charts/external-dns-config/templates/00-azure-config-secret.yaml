{{- if and .Values.externalDNS.enabled .Values.externalDNS.azure.aadClientSecret }}
{{- /*
  Secrets azure.json do ExternalDNS -- um por zona, porque o resourceGroup da
  Private DNS Zone e o da DNS Zone publica sao diferentes.

  Renderizados SOMENTE quando externalDNS.azure.aadClientSecret esta preenchido,
  o que nunca deve acontecer no Git. Em operacao normal estes Secrets sao criados
  fora do repositorio por docs/cliente/scripts/criar-secrets-day2.sh.
*/}}
{{- $az := .Values.externalDNS.azure }}
{{- range $zone := (list .Values.externalDNS.private .Values.externalDNS.public) }}
{{- if $zone.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $zone.configSecretName }}
  namespace: external-dns-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  azure.json: |
    {
      "tenantId": "{{ $az.tenantId }}",
      "subscriptionId": "{{ $az.subscriptionId }}",
      "resourceGroup": "{{ $zone.resourceGroup }}",
      "aadClientId": "{{ $az.aadClientId }}",
      "aadClientSecret": "{{ $az.aadClientSecret }}"
    }
{{- end }}
{{- end }}
{{- end }}
