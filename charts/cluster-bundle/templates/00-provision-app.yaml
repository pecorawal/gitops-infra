{{- if .Values.provision.enabled }}
# WAVE 0 -- HUB. Cria o ClusterDeployment (Hive) que provisiona o cluster
# OpenShift IPI na Azure e o registra como ManagedCluster no ACM.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provision-{{ .Values.clusterName }}
  namespace: {{ .Values.global.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
# ATENCAO: esta Application NAO leva resources-finalizer, e isso e deliberado.
#
# O bundle que a gera sincroniza com prune: true. Se o bundle deixar de emitir
# esta Application -- porque provision.enabled voltou a false, porque alguem
# editou o values, ou por qualquer erro de renderizacao -- o ArgoCD a PRUNA.
# Com o finalizer, apagar a Application dispara delecao em cascata de tudo que
# ela gerencia: Namespace, ClusterDeployment, MachinePool, ManagedCluster. E o
# Hive, ao ver o ClusterDeployment sumir, roda um job de DEPROVISION que destroi
# o cluster na Azure.
#
# Ou seja: uma edicao no values.yaml poderia derrubar um cluster de producao.
# Sem o finalizer o pior caso vira apenas orfandade -- a Application some, o
# cluster continua de pe -- o que e recuperavel reaplicando o values.
#
# Para descomissionar de verdade, veja docs/cliente/02-provisionar-cluster.md.
spec:
  project: {{ .Values.global.project }}
  source:
    {{- include "bundle.source" (dict "root" . "chart" "azure-ipi-cluster") | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.clusterName }}
  # O Hive escreve nestes campos durante e depois do provisionamento.
  # Sem ignoreDifferences o selfHeal entraria em loop revertendo o Hive.
  ignoreDifferences:
    - group: hive.openshift.io
      kind: ClusterDeployment
      jsonPointers:
        - /spec/installed
        - /spec/clusterMetadata
        - /spec/provisioning/installerImageOverride
    - group: hive.openshift.io
      kind: MachinePool
      jsonPointers:
        - /spec/replicas
  {{- include "bundle.syncPolicy" . | nindent 2 }}
{{- end }}
