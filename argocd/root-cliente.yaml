# ---------------------------------------------------------------------------
#  ROOT DO FLUXO CLIENTE -- aplicar UMA unica vez no hub:
#    oc apply -f argocd/root-cliente.yaml
#
#  A partir daqui tudo e Git: o ArgoCD le bootstrap/, instala o GitOpsCluster e
#  o ApplicationSet, e o ApplicationSet passa a reagir a cada commit em
#  clusters/*/values.yaml.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cliente-bootstrap
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/pecorawal/gitops-infra.git'
    targetRevision: cliente
    path: bootstrap
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
